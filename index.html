<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✋ Palmistry Vault</title>
<style>
:root {
  --bg-dark: #0a0a0f;
  --bg-card: #12121a;
  --bg-input: #1a1a2e;
  --accent: #c9a227;
  --accent-glow: rgba(201, 162, 39, 0.3);
  --text-primary: #e8e6e3;
  --text-secondary: #8a8a9a;
  --text-muted: #555566;
  --border: #2a2a3a;
  --success: #27c96a;
  --danger: #c92727;
  --purple: #7c3aed;
  --pink: #e74c8b;
  --blue: #4a90d9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.particles {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.particle {
  position: absolute; width: 2px; height: 2px;
  background: var(--accent); border-radius: 50%;
  opacity: 0; animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(100vh) scale(0); }
  10% { opacity: 0.6; } 90% { opacity: 0.2; }
  100% { opacity: 0; transform: translateY(-10vh) scale(1); }
}

.page { display: none; position: relative; z-index: 1; }
.page.active { display: block; }

.login-container {
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(201,162,39,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 50%, rgba(124,58,237,0.06) 0%, transparent 50%);
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 20px; padding: 48px 40px;
  width: 100%; max-width: 420px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  position: relative; overflow: hidden;
}
.login-card::before {
  content: ''; position: absolute;
  top: 0; left: -50%; right: -50%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.logo { font-size: 56px; margin-bottom: 8px; }
.login-card h1 {
  font-size: 28px;
  background: linear-gradient(135deg, var(--accent), #e8d48b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: 14px; }

.form-group { text-align: left; margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 12px; color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 14px 16px;
  background: var(--bg-input); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-primary);
  font-size: 15px; transition: all 0.3s; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group textarea { resize: vertical; min-height: 80px; }

.btn-primary {
  width: 100%; padding: 14px 24px;
  background: linear-gradient(135deg, var(--accent), #d4a017);
  color: #000; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; letter-spacing: 0.5px;
  position: relative; overflow: hidden;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--accent-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.btn-secondary {
  padding: 10px 20px; background: transparent;
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-secondary); cursor: pointer;
  font-size: 14px; transition: all 0.2s; font-family: inherit;
}
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

.btn-danger {
  padding: 10px 20px; background: transparent;
  border: 1px solid var(--danger); border-radius: 8px;
  color: var(--danger); cursor: pointer; font-size: 14px;
  transition: all 0.2s; font-family: inherit;
}
.btn-danger:hover { background: rgba(201,39,39,0.1); }

.error-msg {
  margin-top: 16px; padding: 12px 16px;
  background: rgba(201,39,39,0.12);
  border: 1px solid rgba(201,39,39,0.3);
  border-radius: 10px; color: #ff6b6b; font-size: 14px;
  animation: shake 0.4s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.dashboard-nav {
  display: flex; align-items: center;
  justify-content: space-between; padding: 14px 28px;
  background: rgba(18,18,26,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.nav-logo {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #e8d48b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-user { color: var(--text-secondary); font-size: 14px; }
.btn-logout {
  padding: 8px 16px; background: transparent;
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-secondary); cursor: pointer;
  font-size: 13px; transition: all 0.2s; font-family: inherit;
}
.btn-logout:hover { border-color: var(--danger); color: var(--danger); }

.dashboard-container {
  max-width: 860px; margin: 0 auto; padding: 28px 16px 100px;
}
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 14px; padding: 28px; margin-bottom: 20px;
  transition: border-color 0.3s; animation: fadeInUp 0.5s ease both;
}
.card:hover { border-color: rgba(201,162,39,0.2); }
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.card h2 {
  font-size: 19px; color: var(--accent);
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}

.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}
.profile-item {
  padding: 14px 16px; background: var(--bg-input);
  border-radius: 10px; border-left: 3px solid var(--accent);
}
.profile-item .label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 4px;
}
.profile-item .value { font-size: 16px; color: var(--text-primary); font-weight: 500; }

.data-block {
  background: var(--bg-input); padding: 20px;
  border-radius: 10px; margin-bottom: 12px;
  border-left: 3px solid var(--accent); transition: border-color 0.3s;
}
.data-block:hover { border-left-color: var(--purple); }
.data-block h3 { color: var(--accent); font-size: 15px; margin-bottom: 10px; }
.detail-row {
  display: flex; justify-content: space-between;
  align-items: center; padding: 6px 0; font-size: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.detail-row:last-child { border-bottom: none; }
.detail-row .key { color: var(--text-muted); }
.detail-row .val { color: var(--text-primary); font-weight: 500; }
.description-text {
  margin-top: 10px; color: var(--text-secondary);
  font-size: 14px; line-height: 1.7; padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.03);
}

.rec-block {
  background: var(--bg-input); padding: 20px;
  border-radius: 10px; margin-bottom: 12px;
  border-left: 3px solid var(--text-muted);
}
.rec-block h3 { font-size: 15px; margin-bottom: 10px; }
.rec-block.career { border-left-color: var(--blue); }
.rec-block.career h3 { color: var(--blue); }
.rec-block.relationships { border-left-color: var(--pink); }
.rec-block.relationships h3 { color: var(--pink); }
.rec-block.health { border-left-color: var(--success); }
.rec-block.health h3 { color: var(--success); }
.rec-block.spiritual { border-left-color: var(--accent); }
.rec-block.spiritual h3 { color: var(--accent); }
.rec-block.strengths { border-left-color: var(--purple); }
.rec-block.strengths h3 { color: var(--purple); }
.rec-block.financial { border-left-color: #f59e0b; }
.rec-block.financial h3 { color: #f59e0b; }
.rec-block.warnings { border-left-color: var(--danger); }
.rec-block.warnings h3 { color: var(--danger); }
.rec-block p { color: var(--text-secondary); font-size: 14px; line-height: 1.8; }

.lucky-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
}
.lucky-item {
  text-align: center; padding: 22px 16px;
  background: var(--bg-input); border-radius: 10px;
  border: 1px solid var(--border); transition: all 0.3s;
}
.lucky-item:hover { border-color: var(--accent); transform: translateY(-2px); }
.lucky-item .icon { font-size: 28px; margin-bottom: 8px; }
.lucky-item .lucky-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--text-muted);
}
.lucky-item .lucky-value {
  font-size: 18px; color: var(--accent);
  font-weight: 700; margin-top: 4px;
}

.notes-content {
  color: var(--text-secondary); font-size: 15px;
  line-height: 1.9; white-space: pre-wrap;
}
.no-data {
  text-align: center; padding: 30px;
  color: var(--text-muted); font-style: italic; font-size: 14px;
}
.meta-info {
  text-align: center; color: var(--text-muted);
  font-size: 12px; letter-spacing: 0.5px;
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.friend-item {
  display: flex; align-items: center;
  justify-content: space-between; padding: 16px 20px;
  background: var(--bg-input); border-radius: 10px;
  cursor: pointer; transition: all 0.2s;
  border: 1px solid transparent; margin-bottom: 8px;
}
.friend-item:hover { border-color: var(--accent); }
.friend-item.active { border-color: var(--accent); background: rgba(201,162,39,0.05); }
.friend-name { font-weight: 600; font-size: 16px; }
.friend-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.friend-actions { display: flex; gap: 8px; }

.tab-nav {
  display: flex; gap: 4px; margin-bottom: 24px;
  overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  padding: 10px 18px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text-secondary); cursor: pointer;
  font-size: 13px; white-space: nowrap;
  transition: all 0.2s; font-family: inherit;
}
.tab-btn.active {
  background: var(--accent); color: #000;
  border-color: var(--accent); font-weight: 700;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

.editor-block {
  background: var(--bg-input); padding: 20px;
  border-radius: 10px; margin-bottom: 16px;
  border-left: 3px solid var(--purple);
}
.editor-block h3 { color: var(--purple); font-size: 15px; margin-bottom: 14px; }

.toast {
  position: fixed; top: 20px; right: 20px;
  padding: 14px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 600; z-index: 9999;
  transform: translateX(calc(100% + 40px));
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.toast.show { transform: translateX(0); }
.toast.success { background: var(--success); color: #fff; }
.toast.error { background: var(--danger); color: #fff; }

.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,15,0.85);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9998; gap: 16px;
}
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-secondary); font-size: 14px; }

.mode-badge {
  display: inline-block; padding: 4px 10px;
  border-radius: 20px; font-size: 11px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  background: rgba(124,58,237,0.2); color: var(--purple);
  border: 1px solid rgba(124,58,237,0.3);
}

@media (max-width: 600px) {
  .login-card { padding: 32px 20px; margin: 16px; }
  .card { padding: 20px; }
  .dashboard-nav { padding: 12px 16px; }
  .form-row { grid-template-columns: 1fr; }
  .profile-grid { grid-template-columns: 1fr 1fr; }
  .lucky-grid { grid-template-columns: repeat(2, 1fr); }
  .nav-user { display: none; }
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Connecting to Palmistry Vault...</div>
</div>

<!-- PAGE 1: LOGIN -->
<div id="loginPage" class="page">
  <div class="login-container">
    <div class="login-card">
      <div class="logo">✋🔮</div>
      <h1>Palmistry Vault</h1>
      <p class="subtitle">Enter your name & date of birth to access your reading</p>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="loginName" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Date of Birth (Your Password)</label>
        <input type="date" id="loginDob">
      </div>
      <button class="btn-primary" onclick="handleLogin()">🔓 Unlock My Reading</button>
      <div id="loginError" style="display:none;" class="error-msg"></div>
      <div style="margin-top:30px; padding-top:20px; border-top:1px solid var(--border);">
        <p style="color:var(--text-muted); font-size:12px; margin-bottom:10px;">ADMIN ACCESS</p>
        <button class="btn-secondary" onclick="showAdminLogin()">🔑 Admin Panel</button>
      </div>
    </div>
  </div>
</div>

<!-- PAGE 2: DASHBOARD -->
<div id="dashboardPage" class="page">
  <nav class="dashboard-nav">
    <span class="nav-logo">✋ Palmistry Vault</span>
    <div class="nav-right">
      <span id="navUserName" class="nav-user"></span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>
  <div class="dashboard-container" id="dashboardContent"></div>
</div>

<!-- PAGE 3: ADMIN -->
<div id="adminPage" class="page">
  <nav class="dashboard-nav">
    <span class="nav-logo">🔑 Admin Panel</span>
    <div class="nav-right">
      <span class="mode-badge">ADMIN MODE</span>
      <button class="btn-logout" onclick="logout()">← Back</button>
    </div>
  </nav>
  <div class="dashboard-container">

    <div id="adminLoginSection">
      <div class="card" style="max-width:420px; margin:40px auto;">
        <h2>🔐 Admin Authentication</h2>
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter admin password">
        </div>
        <button class="btn-primary" onclick="adminAuthenticate()">Access Admin Panel</button>
        <div id="adminLoginError" style="display:none;" class="error-msg"></div>
      </div>
    </div>

    <div id="adminContent" style="display:none;">
      <div class="card">
        <h2>➕ Add New Friend</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" id="newName" placeholder="Friend's name">
          </div>
          <div class="form-group">
            <label>Date of Birth (becomes password) *</label>
            <input type="date" id="newDob">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Gender</label>
            <select id="newGender">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Dominant Hand</label>
            <select id="newHand">
              <option value="Right">Right</option>
              <option value="Left">Left</option>
              <option value="Ambidextrous">Ambidextrous</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" onclick="addFriend()">✅ Add Friend</button>
      </div>

      <div class="card">
        <h2>👥 Your Friends (<span id="friendCount">0</span>)</h2>
        <div id="friendsList"></div>
      </div>

      <div id="editSection" style="display:none;">
        <div class="card">
          <h2>✏️ Editing: <span id="editingFriendName"></span></h2>
          <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab(this,'tabLines')">〰️ Lines</button>
            <button class="tab-btn" onclick="switchTab(this,'tabMounts')">🏔️ Mounts</button>
            <button class="tab-btn" onclick="switchTab(this,'tabFingers')">🖐️ Fingers</button>
            <button class="tab-btn" onclick="switchTab(this,'tabMarkings')">✨ Markings</button>
            <button class="tab-btn" onclick="switchTab(this,'tabRecs')">🔮 Recommendations</button>
            <button class="tab-btn" onclick="switchTab(this,'tabNotes')">📝 Notes</button>
          </div>

          <div id="tabLines" class="tab-content active">
            <div id="linesEditorContent"></div>
            <button class="btn-primary" onclick="saveSection('lines')" style="margin-top:16px;">💾 Save Lines</button>
          </div>
          <div id="tabMounts" class="tab-content">
            <div id="mountsEditorContent"></div>
            <button class="btn-primary" onclick="saveSection('mounts')" style="margin-top:16px;">💾 Save Mounts</button>
          </div>
          <div id="tabFingers" class="tab-content">
            <div id="fingersEditorContent"></div>
            <button class="btn-primary" onclick="saveSection('fingers')" style="margin-top:16px;">💾 Save Fingers</button>
          </div>
          <div id="tabMarkings" class="tab-content">
            <div id="markingsEditorContent"></div>
            <button class="btn-primary" onclick="saveSection('markings')" style="margin-top:16px;">💾 Save Markings</button>
          </div>
          <div id="tabRecs" class="tab-content">
            <div id="recsEditorContent"></div>
            <button class="btn-primary" onclick="saveSection('recommendations')" style="margin-top:16px;">💾 Save Recommendations</button>
          </div>
          <div id="tabNotes" class="tab-content">
            <div class="form-group">
              <label>Hand Shape</label>
              <select id="editHandShape">
                <option value="">Select</option>
                <option value="Earth (Square palm, short fingers) — Practical, grounded, reliable">Earth</option>
                <option value="Air (Square palm, long fingers) — Intellectual, communicative, curious">Air</option>
                <option value="Water (Long palm, long fingers) — Emotional, intuitive, creative">Water</option>
                <option value="Fire (Long palm, short fingers) — Energetic, passionate, bold">Fire</option>
                <option value="Mixed — Combination of elements">Mixed</option>
              </select>
            </div>
            <div class="form-group">
              <label>Personal Notes / Detailed Reading</label>
              <textarea id="editPersonalNotes" rows="10" placeholder="Write your detailed observations..."></textarea>
            </div>
            <button class="btn-primary" onclick="saveSection('notes')">💾 Save Notes</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FIREBASE SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// ============================================
// YOUR FIREBASE CONFIG
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSyCMWF1hMCm2D9N-qzydx33Jdcm-KyxTzaA",
  authDomain: "palmistry-vault.firebaseapp.com",
  projectId: "palmistry-vault",
  storageBucket: "palmistry-vault.firebasestorage.app",
  messagingSenderId: "731739632047",
  appId: "1:731739632047:web:2d508e40809629889f3f5a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================
// CONFIG
// ============================================
const ADMIN_PASSWORD = 'mypalm2024';
// ☝️ CHANGE THIS to your own secret password

// ============================================
// PARTICLES
// ============================================
(function() {
  const c = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 15) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
    c.appendChild(p);
  }
})();

// Hide loading once ready
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingOverlay').style.display = 'none';
    showPage('loginPage');
  }, 1200);
});

// ============================================
// TOAST
// ============================================
function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 20);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 3500);
}

// ============================================
// LOADING
// ============================================
function showLoading(text = 'Loading...') {
  const ol = document.getElementById('loadingOverlay');
  ol.querySelector('.loading-text').textContent = text;
  ol.style.display = 'flex';
}
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

// ============================================
// PAGE NAVIGATION
// ============================================
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
window.showPage = showPage;

window.logout = function() {
  currentUser = null;
  currentEditId = null;
  document.getElementById('loginName').value = '';
  document.getElementById('loginDob').value = '';
  document.getElementById('adminPasswordInput').value = '';
  document.getElementById('adminLoginSection').style.display = 'block';
  document.getElementById('adminContent').style.display = 'none';
  showPage('loginPage');
};

window.showAdminLogin = function() {
  showPage('adminPage');
};

// ============================================
// LOGIN
// ============================================
let currentUser = null;

window.handleLogin = async function() {
  const name = document.getElementById('loginName').value.trim();
  const dob = document.getElementById('loginDob').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  if (!name || !dob) {
    errEl.textContent = 'Please enter both name and date of birth.';
    errEl.style.display = 'block';
    return;
  }

  showLoading('Verifying identity...');

  try {
    const usersRef = collection(db, 'users');
    const snap = await getDocs(usersRef);
    let found = null;

    snap.forEach(docSnap => {
      const data = docSnap.data();
      if (data.name.toLowerCase() === name.toLowerCase() && data.dob === dob) {
        found = { id: docSnap.id, ...data };
      }
    });

    hideLoading();

    if (!found) {
      errEl.textContent = 'Name or date of birth is incorrect. Contact admin.';
      errEl.style.display = 'block';
      return;
    }

    currentUser = found;
    renderDashboard(found);
    showPage('dashboardPage');

  } catch (err) {
    hideLoading();
    errEl.textContent = 'Connection error. Please try again.';
    errEl.style.display = 'block';
    console.error(err);
  }
};

// ============================================
// ADMIN AUTH
// ============================================
window.adminAuthenticate = function() {
  const pass = document.getElementById('adminPasswordInput').value;
  const errEl = document.getElementById('adminLoginError');
  if (pass !== ADMIN_PASSWORD) {
    errEl.textContent = 'Wrong password.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  document.getElementById('adminLoginSection').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  loadFriendsList();
};

// ============================================
// FIRESTORE HELPERS
// ============================================
async function getAllUsers() {
  const snap = await getDocs(collection(db, 'users'));
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function getUserById(id) {
  const snap = await getDoc(doc(db, 'users', id));
  if (!snap.exists()) return null;
  return { id: snap.id, ...snap.data() };
}

// ============================================
// ADD FRIEND
// ============================================
window.addFriend = async function() {
  const name = document.getElementById('newName').value.trim();
  const dob = document.getElementById('newDob').value;
  const gender = document.getElementById('newGender').value;
  const hand = document.getElementById('newHand').value;

  if (!name || !dob) { showToast('Name and DOB are required!', 'error'); return; }

  showLoading('Adding friend...');

  try {
    const users = await getAllUsers();
    if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
      hideLoading();
      showToast('A friend with this name already exists!', 'error');
      return;
    }

    const newUser = createEmptyUser(name, dob, gender, hand);
    const newDocRef = doc(collection(db, 'users'));
    await setDoc(newDocRef, newUser);

    document.getElementById('newName').value = '';
    document.getElementById('newDob').value = '';
    document.getElementById('newGender').value = '';
    document.getElementById('newHand').value = 'Right';

    hideLoading();
    showToast(`${name} added successfully! 🎉`);
    loadFriendsList();
  } catch (err) {
    hideLoading();
    showToast('Error adding friend. Try again.', 'error');
    console.error(err);
  }
};

// ============================================
// FRIENDS LIST
// ============================================
let currentEditId = null;

async function loadFriendsList() {
  showLoading('Loading friends...');
  try {
    const users = await getAllUsers();
    hideLoading();
    document.getElementById('friendCount').textContent = users.length;
    const container = document.getElementById('friendsList');

    if (users.length === 0) {
      container.innerHTML = '<div class="no-data">No friends added yet. Add your first friend above! 👆</div>';
      return;
    }

    container.innerHTML = users.map(u => `
      <div class="friend-item ${currentEditId === u.id ? 'active' : ''}" onclick="selectFriend('${u.id}')">
        <div>
          <div class="friend-name">${u.name}</div>
          <div class="friend-meta">DOB: ${formatDate(u.dob)} · ${u.gender || 'N/A'} · ${u.dominantHand} hand</div>
        </div>
        <div class="friend-actions">
          <button class="btn-secondary" onclick="event.stopPropagation(); selectFriend('${u.id}')">✏️ Edit</button>
          <button class="btn-danger" onclick="event.stopPropagation(); deleteFriend('${u.id}','${u.name}')">🗑️</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    hideLoading();
    showToast('Error loading friends.', 'error');
  }
}

window.deleteFriend = async function(id, name) {
  if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
  showLoading('Deleting...');
  try {
    await deleteDoc(doc(db, 'users', id));
    if (currentEditId === id) {
      currentEditId = null;
      document.getElementById('editSection').style.display = 'none';
    }
    hideLoading();
    showToast(`${name} deleted.`);
    loadFriendsList();
  } catch (err) {
    hideLoading();
    showToast('Error deleting.', 'error');
  }
};

// ============================================
// SELECT & EDIT FRIEND
// ============================================
window.selectFriend = async function(id) {
  showLoading('Loading data...');
  try {
    const user = await getUserById(id);
    if (!user) { hideLoading(); return; }
    currentEditId = id;
    hideLoading();
    document.getElementById('editingFriendName').textContent = user.name;
    document.getElementById('editSection').style.display = 'block';
    loadFriendsList();
    renderAllEditors(user);
    document.getElementById('editSection').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    hideLoading();
    showToast('Error loading user data.', 'error');
  }
};

window.switchTab = function(btn, tabId) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

  document.getElementById(tabId).classList.add('active');

function renderLinesEditor(user) {
  const lines = user.lines || {};
  const config = [
    { key:'heart', label:'❤️ Heart Line', fields:['quality','length','depth','branches','description'] },
    { key:'head', label:'🧠 Head Line', fields:['quality','length','depth','branches','description'] },
    { key:'life', label:'🌿 Life Line', fields:['quality','length','depth','branches','description'] },
    { key:'fate', label:'🎯 Fate Line', fields:['quality','length','depth','branches','description'] },
    { key:'sun', label:'☀️ Sun Line', fields:['quality','length','depth','branches','description'] },
    { key:'mercury', label:'☿ Mercury Line', fields:['quality','length','depth','branches','description'] },
    { key:'marriage', label:'💍 Marriage Line(s)', fields:['count','quality','description'] },
    { key:'girdle_of_venus', label:'🌙 Girdle of Venus', fields:['present','description'] },
    { key:'rascettes', label:'⌚ Rascettes', fields:['count','description'] }
  ];
  let html = '';
  config.forEach(c => {
    const line = lines[c.key] || {};
    html += `<div class="editor-block"><h3>${c.label}</h3>`;
    c.fields.forEach(f => {
      const val = line[f] || '';
      if (f === 'description') {
        html += `<div class="form-group"><label>${f}</label><textarea id="ed_line_${c.key}_${f}" rows="3" placeholder="Detailed interpretation...">${val}</textarea></div>`;
      } else {
        let ph = { quality:'Clear, Chained, Broken, Wavy, Forked...', length:'Long, Medium, Short', depth:'Deep, Medium, Shallow', branches:'Upward, Downward, None', count:'1, 2, 3...', present:'Yes / No' }[f] || '';
        html += `<div class="form-group"><label>${f}</label><input type="text" id="ed_line_${c.key}_${f}" value="${val}" placeholder="${ph}"></div>`;
      }
    });
    html += `</div>`;
  });
  document.getElementById('linesEditorContent').innerHTML = html;
}

// ============================================
// SAVE SECTION TO FIREBASE
// ============================================
window.saveSection = async function(section) {
  if (!currentEditId) return;
  showLoading('Saving...');

  try {
    let updates = {};

    if (section === 'lines') {
      const lineKeys = ['heart','head','life','fate','sun','mercury','marriage','girdle_of_venus','rascettes'];
      const fieldMap = {
        heart:['quality','length','depth','branches','description'],
        head:['quality','length','depth','branches','description'],
        life:['quality','length','depth','branches','description'],
        fate:['quality','length','depth','branches','description'],
        sun:['quality','length','depth','branches','description'],
        mercury:['quality','length','depth','branches','description'],
        marriage:['count','quality','description'],
        girdle_of_venus:['present','description'],
        rascettes:['count','description']
      };
      updates.lines = {};
      lineKeys.forEach(key => {
        updates.lines[key] = {};
        fieldMap[key].forEach(f => {
          const el = document.getElementById(`ed_line_${key}_${f}`);
          if (el) updates.lines[key][f] = el.value;
        });
      });
    }

    if (section === 'mounts') {
      const keys = ['jupiter','saturn','apollo','mercury_mount','venus','moon','mars_positive','mars_negative','plain_of_mars'];
      updates.mounts = {};
      keys.forEach(key => {
        updates.mounts[key] = {
          development: document.getElementById(`ed_mount_${key}_dev`).value,
          description: document.getElementById(`ed_mount_${key}_desc`).value
        };
      });
    }

    if (section === 'fingers') {
      const fingerConfig = {
        thumb: ['length','tip','flexibility','phalanges','desc'],
        index: ['length','tip','leaning','desc'],
        middle: ['length','tip','leaning','desc'],
        ring: ['length','tip','leaning','desc'],
        little: ['length','tip','leaning','desc']
      };
      updates.fingers = {};
      for (const [key, fields] of Object.entries(fingerConfig)) {
        updates.fingers[key] = {};
        fields.forEach(f => {
          const el = document.getElementById(`ed_finger_${key}_${f}`);
          if (el) {
            const realKey = f === 'tip' ? 'tip_shape' : f === 'desc' ? 'description' : f;
            updates.fingers[key][realKey] = el.value;
          }
        });
      }
    }

    if (section === 'markings') {
      const types = ['crosses','stars','islands','squares','triangles','grilles','dots','tridents'];
      updates.specialMarkings = {};
      types.forEach(type => {
        const text = document.getElementById(`ed_marking_${type}`).value;
        updates.specialMarkings[type] = text.split('\n').map(s => s.trim()).filter(s => s);
      });
    }

    if (section === 'recommendations') {
      const recFields = ['career','relationships','health','spiritual','financialTendency','strengths','weaknesses','warnings'];
      updates.recommendations = {};
      recFields.forEach(f => {
        updates.recommendations[f] = document.getElementById(`ed_rec_${f}`).value;
      });
      updates.recommendations.luckyElements = {
        color: document.getElementById('ed_lucky_color').value,
        number: document.getElementById('ed_lucky_number').value,
        day: document.getElementById('ed_lucky_day').value,
        gemstone: document.getElementById('ed_lucky_gemstone').value
      };
    }

    if (section === 'notes') {
      updates.handShape = document.getElementById('editHandShape').value;
      updates.personalNotes = document.getElementById('editPersonalNotes').value;
    }

    updates.lastUpdated = new Date().toISOString();
    await updateDoc(doc(db, 'users', currentEditId), updates);

    hideLoading();
    showToast(`${capitalize(section)} saved! ✨`);
  } catch (err) {
    hideLoading();
    showToast('Error saving. Try again.', 'error');
    console.error(err);
  }
};

// ============================================
// DASHBOARD RENDERING
// ============================================
function renderDashboard(user) {
  document.getElementById('navUserName').textContent = `Welcome, ${user.name} ✨`;
  let html = '';

  html += `<section class="card">
    <h2>👤 Profile</h2>
    <div class="profile-grid">
      <div class="profile-item"><div class="label">Name</div><div class="value">${user.name}</div></div>
      <div class="profile-item"><div class="label">Date of Birth</div><div class="value">${formatDate(user.dob)}</div></div>
      <div class="profile-item"><div class="label">Gender</div><div class="value">${user.gender||'—'}</div></div>
      <div class="profile-item"><div class="label">Dominant Hand</div><div class="value">${user.dominantHand||'Right'}</div></div>
    </div></section>`;

  if (user.handShape) {
    html += `<section class="card"><h2>🖐️ Hand Shape</h2>
      <p style="color:var(--text-secondary);font-size:15px;line-height:1.7;">${user.handShape}</p>
    </section>`;
  }

  html += renderDashLines(user.lines);
  html += renderDashMounts(user.mounts);
  html += renderDashFingers(user.fingers);
  html += renderDashMarkings(user.specialMarkings);
  html += renderDashRecs(user.recommendations);
  html += renderDashLucky(user.recommendations?.luckyElements);

  if (user.personalNotes) {
    html += `<section class="card"><h2>📝 Personal Reading Notes</h2>
      <div class="notes-content">${user.personalNotes}</div></section>`;
  }

  html += `<section class="card">
    <div class="meta-info">
      Reading created: ${formatDate(user.createdDate)} &nbsp;·&nbsp;
      Last updated: ${formatDate(user.lastUpdated)}
    </div></section>`;

  document.getElementById('dashboardContent').innerHTML = html;
}

function renderDashLines(lines) {
  if (!lines || !hasContent(lines)) return '';
  const config = [
    { key:'heart', label:'❤️ Heart Line' }, { key:'head', label:'🧠 Head Line' },
    { key:'life', label:'🌿 Life Line' }, { key:'fate', label:'🎯 Fate Line' },
    { key:'sun', label:'☀️ Sun Line' }, { key:'mercury', label:'☿ Mercury Line' },
    { key:'marriage', label:'💍 Marriage Line(s)' },
    { key:'girdle_of_venus', label:'🌙 Girdle of Venus' },
    { key:'rascettes', label:'⌚ Rascettes' }
  ];
  let blocks = '';
  config.forEach(c => {
    const line = lines[c.key];
    if (!line || !hasContent(line)) return;
    blocks += `<div class="data-block"><h3>${c.label}</h3>`;

      if (line[f]) blocks += `<div class="detail-row"><span class="key">${capitalize(f)}</span><span class="val">${line[f]}</span></div>`;

    if (line.description) blocks += `<div class="description-text">${line.description}</div>`;
    blocks += `</div>`;
  });
  return blocks ? `<section class="card"><h2>〰️ Palm Lines</h2>${blocks}</section>` : '';
}

// ============================================
// HELPERS
// ============================================
function hasContent(obj) {
  if (!obj) return false;
  return Object.values(obj).some(v => {
    if (typeof v === 'string') return v.trim() !== '';
    if (Array.isArray(v)) return v.length > 0;
    if (typeof v === 'object' && v !== null) return hasContent(v);
    return !!v;
  });
}
function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }
function formatDate(str) {
  if (!str) return '—';
  try { return new Date(str).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' }); }
  catch { return str; }
}

  }
});

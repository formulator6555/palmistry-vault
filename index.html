<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कर्मरेखा — Karmarekha by Raj</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   KARMAREKHA — DARK PURPLE + GOLD
   Phase 1: Soul of the Portal
   ============================================ */
:root {
  --bg-deep: #0d0618;
  --bg-card: #1a0a2e;
  --bg-input: #240d3d;
  --border: #3d1f5e;
  --border-light: #4a2670;
  --accent: #c9a227;
  --accent-light: #e8d48b;
  --accent-glow: rgba(201,162,39,0.3);
  --accent-glow2: rgba(201,162,39,0.15);
  --text-primary: #f0ede8;
  --text-secondary: #9d8fad;
  --text-muted: #5a4d6b;
  --success: #27c96a;
  --danger: #c92727;
  --fire: #ff6b35;
  --water: #4a90d9;
  --earth: #6b8f47;
  --air: #9b59b6;
  --pink: #e74c8b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Raleway', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
h1,h2,h3,h4,.brand-text,.nav-logo,.login-card h1 {
  font-family: 'Cinzel', serif;
}
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:var(--bg-deep); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--border-light); }

/* ---- PARTICLES ---- */
.particles {
  position:fixed; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:hidden;
}
.particle {
  position:absolute; border-radius:50%;
  opacity:0; animation:floatUp linear infinite;
}
.particle.gold {
  background:var(--accent);
  box-shadow:0 0 6px var(--accent-glow);
}
.particle.purple {
  background:var(--border-light);
  box-shadow:0 0 6px rgba(74,38,112,0.4);
}
@keyframes floatUp {
  0% { opacity:0; transform:translateY(100vh) scale(0) rotate(0deg); }
  10% { opacity:0.7; }
  50% { opacity:0.3; }
  100% { opacity:0; transform:translateY(-10vh) scale(1) rotate(180deg); }
}

/* ---- LOADING ---- */
.loading-overlay {
  position:fixed; inset:0;
  background:var(--bg-deep);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:9998; gap:20px;
}
.loading-seal {
  width:80px; height:80px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
  display:flex; align-items:center; justify-content:center;
}
.loading-seal::after {
  content:'र'; font-size:28px;
  color:var(--accent);
  font-family:'Cinzel',serif;
  animation:spinReverse 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes spinReverse { to { transform:rotate(-360deg); } }
.loading-text {
  color:var(--text-secondary);
  font-family:'Cinzel',serif;
  font-size:14px; letter-spacing:3px;
  text-transform:uppercase;
}

/* ---- PAGE SYSTEM ---- */
.page { display:none; position:relative; z-index:1; }
.page.active { display:block; }

/* ---- TOAST ---- */
.toast {
  position:fixed; top:20px; right:20px;
  padding:14px 28px; border-radius:10px;
  font-size:14px; font-weight:600; z-index:9999;
  transform:translateX(calc(100% + 40px));
  transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  font-family:'Raleway',sans-serif;
}
.toast.show { transform:translateX(0); }
.toast.success { background:var(--success); color:#fff; }
.toast.error { background:var(--danger); color:#fff; }

/* ============================================
   LOGIN PAGE
   ============================================ */
.login-container {
  min-height:100vh; display:flex;
  align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(201,162,39,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(74,38,112,0.1) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(13,6,24,1) 0%, var(--bg-deep) 100%);
}

.login-card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:52px 44px;
  width:100%; max-width:440px;
  text-align:center;
  box-shadow:0 20px 80px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow2);
  position:relative; overflow:hidden;
}
.login-card::before {
  content:''; position:absolute;
  top:0; left:-50%; right:-50%; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
}
.login-card::after {
  content:''; position:absolute;
  bottom:0; left:-50%; right:-50%; height:1px;
  background:linear-gradient(90deg, transparent, var(--border-light), transparent);
}

/* SEAL LOGO */
.seal-logo {
  width:90px; height:90px; margin:0 auto 16px;
  position:relative;
  display:flex; align-items:center; justify-content:center;
}
.seal-outer {
  position:absolute; inset:0;
  border:2px solid var(--accent);
  border-radius:50%;
  animation:slowSpin 20s linear infinite;
}
.seal-outer::before {
  content:''; position:absolute; inset:4px;
  border:1px solid var(--border-light);
  border-radius:50%;
}
.seal-lines {
  position:absolute; inset:0;
}
.seal-lines::before, .seal-lines::after {
  content:''; position:absolute;
  background:var(--accent);
  opacity:0.3;
}
.seal-lines::before {
  width:1px; height:100%;
  left:50%; top:0;
}
.seal-lines::after {
  width:100%; height:1px;
  top:50%; left:0;
}
@keyframes slowSpin { to { transform:rotate(360deg); } }
.seal-ra {
  font-size:36px; color:var(--accent);
  font-family:'Cinzel',serif;
  font-weight:700; z-index:1;
  text-shadow:0 0 20px var(--accent-glow);
}

.brand-title {
  font-family:'Cinzel',serif;
  font-size:26px; font-weight:700;
  letter-spacing:4px;
  background:linear-gradient(135deg, var(--accent), var(--accent-light), var(--accent));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:2px;
}
.brand-subtitle {
  font-family:'Cinzel',serif;
  font-size:12px; color:var(--text-muted);
  letter-spacing:6px; text-transform:uppercase;
  margin-bottom:28px;
}
.login-tagline {
  color:var(--text-secondary);
  font-size:13px; margin-bottom:28px;
  font-style:italic; letter-spacing:0.5px;
}

.form-group { text-align:left; margin-bottom:20px; }
.form-group label {
  display:block; font-size:11px;
  color:var(--text-secondary);
  margin-bottom:6px; text-transform:uppercase;
  letter-spacing:1.5px; font-weight:600;
}
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:14px 16px;
  background:var(--bg-input);
  border:1px solid var(--border);
  border-radius:10px; color:var(--text-primary);
  font-size:15px; transition:all 0.3s;
  font-family:'Raleway',sans-serif;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.form-group textarea { resize:vertical; min-height:80px; }

.btn-primary {
  width:100%; padding:15px 24px;
  background:linear-gradient(135deg, var(--accent), #b8911f);
  color:var(--bg-deep); border:none;
  border-radius:10px; font-size:15px;
  font-weight:700; cursor:pointer;
  transition:all 0.3s;
  font-family:'Cinzel',serif;
  letter-spacing:2px;
  text-transform:uppercase;
  position:relative; overflow:hidden;
}
.btn-primary::after {
  content:''; position:absolute;
  top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition:left 0.6s;
}
.btn-primary:hover::after { left:100%; }
.btn-primary:hover {
  transform:translateY(-2px);
  box-shadow:0 6px 30px var(--accent-glow);
}
.btn-primary:active { transform:translateY(0); }
.btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

.btn-secondary {
  padding:10px 22px; background:transparent;
  border:1px solid var(--border);
  border-radius:8px; color:var(--text-secondary);
  cursor:pointer; font-size:13px;
  transition:all 0.2s; font-family:'Cinzel',serif;
  letter-spacing:1px;
}
.btn-secondary:hover { border-color:var(--accent); color:var(--accent); }

.btn-danger {
  padding:10px 20px; background:transparent;
  border:1px solid var(--danger); border-radius:8px;
  color:var(--danger); cursor:pointer;
  font-size:13px; transition:all 0.2s;
  font-family:'Raleway',sans-serif;
}
.btn-danger:hover { background:rgba(201,39,39,0.1); }

.error-msg {
  margin-top:16px; padding:12px 16px;
  background:rgba(201,39,39,0.12);
  border:1px solid rgba(201,39,39,0.3);
  border-radius:10px; color:#ff6b6b;
  font-size:13px; animation:shake 0.4s ease;
}
@keyframes shake {
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}

.admin-link {
  margin-top:32px; padding-top:24px;
  border-top:1px solid var(--border);
}
.admin-link p {
  color:var(--text-muted); font-size:11px;
  margin-bottom:10px; letter-spacing:2px;
  text-transform:uppercase;
  font-family:'Cinzel',serif;
}

/* ============================================
   NAVIGATION
   ============================================ */
.dashboard-nav {
  display:flex; align-items:center;
  justify-content:space-between;
  padding:14px 28px;
  background:rgba(26,10,46,0.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
}
.nav-brand {
  display:flex; align-items:center; gap:12px;
}
.nav-seal {
  width:32px; height:32px;
  border:1.5px solid var(--accent);
  border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  font-family:'Cinzel',serif;
  color:var(--accent); font-size:14px;
  font-weight:700;
}
.nav-logo {
  font-size:16px; font-weight:700;
  letter-spacing:3px;
  background:linear-gradient(135deg, var(--accent), var(--accent-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.nav-right { display:flex; align-items:center; gap:12px; }
.nav-user {
  color:var(--text-secondary); font-size:13px;
  font-family:'Cinzel',serif; letter-spacing:1px;
}
.btn-logout {
  padding:8px 16px; background:transparent;
  border:1px solid var(--border); border-radius:8px;
  color:var(--text-secondary); cursor:pointer;
  font-size:12px; transition:all 0.2s;
  font-family:'Raleway',sans-serif;
}
.btn-logout:hover { border-color:var(--danger); color:var(--danger); }

/* ============================================
   DASHBOARD
   ============================================ */
.dashboard-container {
  max-width:860px; margin:0 auto;
  padding:28px 16px 100px;
}

.card {
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:16px; padding:32px;
  margin-bottom:24px;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  animation:fadeInUp 0.6s ease both;
}
.card:nth-child(2){animation-delay:0.05s}
.card:nth-child(3){animation-delay:0.1s}
.card:nth-child(4){animation-delay:0.15s}
.card:nth-child(5){animation-delay:0.2s}
.card:nth-child(6){animation-delay:0.25s}
.card:nth-child(7){animation-delay:0.3s}
.card:nth-child(8){animation-delay:0.35s}
.card:nth-child(9){animation-delay:0.4s}
.card:nth-child(10){animation-delay:0.45s}
@keyframes fadeInUp {
  from{opacity:0;transform:translateY(24px)}
  to{opacity:1;transform:translateY(0)}
}
.card h2 {
  font-family:'Cinzel',serif;
  font-size:18px; color:var(--accent);
  margin-bottom:20px; padding-bottom:14px;
  border-bottom:1px solid var(--border);
  letter-spacing:2px;
}

/* ---- GREETING SCREEN ---- */
.greeting-overlay {
  position:fixed; inset:0;
  background:var(--bg-deep);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:200; text-align:center;
  padding:40px;
  animation:greetFadeIn 1s ease both;
}
@keyframes greetFadeIn {
  from{opacity:0} to{opacity:1}
}
.greeting-seal {
  width:100px; height:100px;
  border:2px solid var(--accent);
  border-radius:50%;
  display:flex; align-items:center;
  justify-content:center;
  margin-bottom:24px;
  box-shadow:0 0 40px var(--accent-glow);
  animation:greetPulse 3s ease-in-out infinite;
}
@keyframes greetPulse {
  0%,100%{box-shadow:0 0 20px var(--accent-glow)}
  50%{box-shadow:0 0 50px var(--accent-glow), 0 0 80px rgba(201,162,39,0.1)}
}
.greeting-seal .seal-ra { font-size:42px; }
.greeting-brand {
  font-family:'Cinzel',serif;
  font-size:14px; color:var(--accent);
  letter-spacing:6px; text-transform:uppercase;
  margin-bottom:8px;
}
.greeting-line {
  width:60px; height:1px;
  background:linear-gradient(90deg, transparent, var(--accent), transparent);
  margin:0 auto 32px;
}
.greeting-text {
  font-family:'Raleway',sans-serif;
  font-size:17px; color:var(--text-secondary);
  line-height:2; max-width:500px;
  font-weight:300; font-style:italic;
  letter-spacing:0.5px;
  animation:greetTextFade 2s ease both 0.5s;
}
@keyframes greetTextFade {
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.greeting-name {
  color:var(--accent); font-weight:600;
  font-style:normal;
}
.greeting-enter {
  margin-top:40px; padding:14px 40px;
  background:transparent;
  border:1px solid var(--accent);
  border-radius:30px; color:var(--accent);
  cursor:pointer; font-family:'Cinzel',serif;
  font-size:13px; letter-spacing:3px;
  text-transform:uppercase;
  transition:all 0.3s;
  animation:greetBtnFade 1.5s ease both 1.5s;
}
@keyframes greetBtnFade {
  from{opacity:0} to{opacity:1}
}
.greeting-enter:hover {
  background:var(--accent);
  color:var(--bg-deep);
  box-shadow:0 0 30px var(--accent-glow);
}

/* ---- ELEMENT CARD ---- */
.element-card {
  border-radius:16px; padding:36px;
  text-align:center; margin-bottom:24px;
  position:relative; overflow:hidden;
  animation:fadeInUp 0.6s ease both 0.1s;
}
.element-card.fire {
  background:linear-gradient(135deg, #1a0505 0%, #2d0a0a 50%, #1a0505 100%);
  border:1px solid rgba(255,107,53,0.3);
}
.element-card.water {
  background:linear-gradient(135deg, #050d1a 0%, #0a1a2d 50%, #050d1a 100%);
  border:1px solid rgba(74,144,217,0.3);
}
.element-card.earth {
  background:linear-gradient(135deg, #0d1a05 0%, #152d0a 50%, #0d1a05 100%);
  border:1px solid rgba(107,143,71,0.3);
}
.element-card.air {
  background:linear-gradient(135deg, #0d051a 0%, #1a0a2d 50%, #0d051a 100%);
  border:1px solid rgba(155,89,182,0.3);
}
.element-icon { font-size:48px; margin-bottom:12px; }
.element-title {
  font-family:'Cinzel',serif;
  font-size:22px; letter-spacing:4px;
  margin-bottom:4px;
}
.element-card.fire .element-title { color:var(--fire); }
.element-card.water .element-title { color:var(--water); }
.element-card.earth .element-title { color:var(--earth); }
.element-card.air .element-title { color:var(--air); }
.element-subtitle {
  font-size:12px; color:var(--text-muted);
  letter-spacing:2px; margin-bottom:20px;
}
.element-traits {
  display:flex; gap:16px; justify-content:center;
  flex-wrap:wrap; margin-bottom:20px;
}
.element-trait {
  padding:6px 16px; border-radius:20px;
  font-size:12px; font-weight:500;
  letter-spacing:1px;
}
.element-card.fire .element-trait { background:rgba(255,107,53,0.15); color:var(--fire); border:1px solid rgba(255,107,53,0.2); }
.element-card.water .element-trait { background:rgba(74,144,217,0.15); color:var(--water); border:1px solid rgba(74,144,217,0.2); }
.element-card.earth .element-trait { background:rgba(107,143,71,0.15); color:var(--earth); border:1px solid rgba(107,143,71,0.2); }
.element-card.air .element-trait { background:rgba(155,89,182,0.15); color:var(--air); border:1px solid rgba(155,89,182,0.2); }
.element-quote {
  font-style:italic; color:var(--text-secondary);
  font-size:14px; line-height:1.8;
  max-width:400px; margin:0 auto;
}

/* ---- SCORE CARDS ---- */
.scores-grid {
  display:grid; gap:14px;
}
.score-item {
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; background:var(--bg-input);
  border-radius:10px; border-left:3px solid var(--border);
}
.score-item.career { border-left-color:var(--accent); }
.score-item.love { border-left-color:var(--pink); }
.score-item.spiritual { border-left-color:var(--air); }
.score-item.financial { border-left-color:#f59e0b; }
.score-item.health { border-left-color:var(--success); }
.score-icon { font-size:24px; min-width:32px; text-align:center; }
.score-info { flex:1; }
.score-label {
  font-size:12px; color:var(--text-secondary);
  letter-spacing:1px; text-transform:uppercase;
  margin-bottom:6px; font-weight:600;
}
.score-bar-bg {
  width:100%; height:8px;
  background:rgba(255,255,255,0.05);
  border-radius:4px; overflow:hidden;
}
.score-bar-fill {
  height:100%; border-radius:4px;
  transition:width 1.5s cubic-bezier(0.16,1,0.3,1);
  width:0;
}
.score-item.career .score-bar-fill { background:linear-gradient(90deg, var(--accent), var(--accent-light)); }
.score-item.love .score-bar-fill { background:linear-gradient(90deg, var(--pink), #f0a0c0); }
.score-item.spiritual .score-bar-fill { background:linear-gradient(90deg, var(--air), #c9a0e8); }
.score-item.financial .score-bar-fill { background:linear-gradient(90deg, #f59e0b, #fbbf24); }
.score-item.health .score-bar-fill { background:linear-gradient(90deg, var(--success), #6bffaa); }
.score-value {
  font-family:'Cinzel',serif;
  font-size:18px; font-weight:700;
  min-width:45px; text-align:right;
  color:var(--text-primary);
}

/* ---- DUALITY CARD ---- */
.duality-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:0; border-radius:12px; overflow:hidden;
}
.duality-side {
  padding:24px;
}
.duality-light {
  background:rgba(201,162,39,0.06);
  border-right:1px solid var(--border);
}
.duality-shadow {
  background:rgba(155,89,182,0.06);
}
.duality-header {
  font-family:'Cinzel',serif;
  font-size:13px; letter-spacing:2px;
  margin-bottom:16px; text-transform:uppercase;
}
.duality-light .duality-header { color:var(--accent); }
.duality-shadow .duality-header { color:var(--air); }
.duality-item {
  padding:8px 0; font-size:14px;
  color:var(--text-secondary);
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.duality-item:last-child { border-bottom:none; }

/* ---- PROFILE ---- */
.profile-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;
}
.profile-item {
  padding:16px; background:var(--bg-input);
  border-radius:10px;
  border-left:3px solid var(--accent);
}
.profile-item .label {
  font-size:10px; text-transform:uppercase;
  letter-spacing:1.5px; color:var(--text-muted);
  margin-bottom:4px; font-weight:600;
}
.profile-item .value {
  font-size:16px; color:var(--text-primary);
  font-weight:500;
}

/* ---- DATA BLOCKS ---- */
.data-block {
  background:var(--bg-input); padding:22px;
  border-radius:12px; margin-bottom:14px;
  border-left:3px solid var(--accent);
  transition:all 0.3s;
}
.data-block:hover {
  border-left-color:var(--accent-light);
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
}
.data-block h3 {
  font-family:'Cinzel',serif;
  color:var(--accent); font-size:14px;
  margin-bottom:10px; letter-spacing:1px;
}
.detail-row {
  display:flex; justify-content:space-between;
  align-items:center; padding:6px 0; font-size:14px;
  border-bottom:1px solid rgba(255,255,255,0.03);
}
.detail-row:last-child { border-bottom:none; }

function calculateScores(user){
  let career=50,love=50,spiritual=50,financial=50,health=50;

  if(m.jupiter?.development?.includes('Well'))career+=15;

  if(m.saturn?.development?.includes('Well'))career+=8;
  if(l.fate?.quality?.includes('Clear'))career+=12;
  if(l.sun?.length&&l.sun.length!=='Absent')career+=10;
  if(m.venus?.development?.includes('Well'))love+=15;
  if(l.heart?.quality?.includes('Clear'))love+=12;
  if(l.heart?.length?.includes('Long'))love+=8;
  if(l.marriage?.count&&parseInt(l.marriage.count)>=1)love+=10;
  if(m.moon?.development?.includes('Well'))spiritual+=15;

  if(m.mercury_mount?.development?.includes('Well'))financial+=15;

  return{career:cap(career),love:cap(love),spiritual:cap(spiritual),financial:cap(financial),health:cap(health)};

let currentUser=null;
window.handleLogin=async function(){
  const name=document.getElementById('loginName').value.trim();
  const dob=document.getElementById('loginDob').value;
  const err=document.getElementById('loginError');
  err.style.display='none';
  if(!name||!dob){err.textContent='Enter both name and date of birth.';err.style.display='block';return;}
  showLoading('Consulting the stars...');

    currentUser=found;

    document.getElementById('greetingOverlay').style.display='flex';

window.addFriend=async function(){
  const name=document.getElementById('newName').value.trim();
  const dob=document.getElementById('newDob').value;
  const gender=document.getElementById('newGender').value;
  const hand=document.getElementById('newHand').value;
  if(!name||!dob){showToast('Name and DOB required!','error');return;}
  showLoading('Adding soul...');
  try{

    if(users.find(u=>u.name.toLowerCase()===name.toLowerCase())){hideLoading();showToast('Name already exists!','error');return;}
    const nu=createEmptyUser(name,dob,gender,hand);

    document.getElementById('newName').value='';document.getElementById('newDob').value='';
    document.getElementById('newGender').value='';document.getElementById('newHand').value='Right';

let currentEditId=null;
async function loadFriendsList(){
  showLoading('Loading souls...');
  try{
    const users=await getAllUsers();hideLoading();
    document.getElementById('friendCount').textContent=users.length;
    const c=document.getElementById('friendsList');
    if(!users.length){c.innerHTML='<div class="no-data">No souls added yet</div>';return;}
    c.innerHTML=users.map(u=>`

      </div>`).join('');

}

window.deleteFriend=async function(id,name){

window.selectFriend=async function(id){

// SAVE
window.saveSection=async function(section){
  if(!currentEditId)return;showLoading('Saving...');
  try{
    let updates={};
    if(section==='lines'){
      const keys=['heart','head','life','fate','sun','mercury','marriage','girdle_of_venus','rascettes'];
      const fm={heart:['quality','length','depth','branches','description'],head:['quality','length','depth','branches','description'],life:['quality','length','depth','branches','description'],fate:['quality','length','depth','branches','description'],sun:['quality','length','depth','branches','description'],mercury:['quality','length','depth','branches','description'],marriage:['count','quality','description'],girdle_of_venus:['present','description'],rascettes:['count','description']};
      updates.lines={};keys.forEach(k=>{updates.lines[k]={};fm[k].forEach(f=>{const el=document.getElementById(`ed_l_${k}_${f}`);if(el)updates.lines[k][f]=el.value;});});
    }
    if(section==='mounts'){
      const keys=['jupiter','saturn','apollo','mercury_mount','venus','moon','mars_positive','mars_negative','plain_of_mars'];
      updates.mounts={};keys.forEach(k=>{updates.mounts[k]={development:document.getElementById(`ed_m_${k}_d`).value,description:document.getElementById(`ed_m_${k}_desc`).value};});
    }
    if(section==='fingers'){
      const cfg={thumb:['len','tip','flexibility','phalanges','desc'],index:['len','tip','leaning','desc'],middle:['len','tip','leaning','desc'],ring:['len','tip','leaning','desc'],little:['len','tip','leaning','desc']};
      updates.fingers={};for(const[k,flds]of Object.entries(cfg)){updates.fingers[k]={};flds.forEach(f=>{const el=document.getElementById(`ed_f_${k}_${f}`);if(el){const rk=f==='len'?'length':f==='tip'?'tip_shape':f==='desc'?'description':f;updates.fingers[k][rk]=el.value;}});}
    }
    if(section==='markings'){
      const types=['crosses','stars','islands','squares','triangles','grilles','dots','tridents'];
      updates.specialMarkings={};types.forEach(t=>{const txt=document.getElementById(`ed_mk_${t}`).value;updates.specialMarkings[t]=txt.split('\n').map(s=>s.trim()).filter(s=>s);});
    }
    if(section==='recommendations'){
      const flds=['career','relationships','health','spiritual','financialTendency','strengths','weaknesses','warnings'];
      updates.recommendations={};flds.forEach(f=>{updates.recommendations[f]=document.getElementById(`ed_r_${f}`).value;});
      updates.recommendations.luckyElements={color:document.getElementById('ed_lk_color').value,number:document.getElementById('ed_lk_number').value,day:document.getElementById('ed_lk_day').value,gemstone:document.getElementById('ed_lk_gemstone').value};
    }
    if(section==='notes'){updates.handShape=document.getElementById('editHandShape').value;updates.personalNotes=document.getElementById('editPersonalNotes').value;}
    updates.lastUpdated=new Date().toISOString();
    await updateDoc(doc(db,'users',currentEditId),updates);
    hideLoading();showToast(`${section.charAt(0).toUpperCase()+section.slice(1)} saved ✦`);
  }catch(e){hideLoading();showToast('Error saving.','error');console.error(e);}
};

  if(!lk||!hasContent(lk))return'';
  let i='';
  if(lk.color)i+=`<div class="lucky-item"><div class="icon">🎨</div><div class="lucky-label">Color</div><div class="lucky-value">${lk.color}</div></div>`;
  if(lk.number)i+=`<div class="lucky-item"><div class="icon">🔢</div><div class="lucky-label">Number</div><div class="lucky-value">${lk.number}</div></div>`;
  if(lk.day)i+=`<div class="lucky-item"><div class="icon">📅</div><div class="lucky-label">Day</div><div class="lucky-value">${lk.day}</div></div>`;
  if(lk.gemstone)i+=`<div class="lucky-item"><div class="icon">💎</div><div class="lucky-label">Gemstone</div><div class="lucky-value">${lk.gemstone}</div></div>`;
  return i?`<section class="card"><h2>Cosmic Alignments</h2><div class="lucky-grid">${i}</div></section>`:'';
}

// HELPERS
function hasContent(o){if(!o)return false;return Object.values(o).some(v=>{if(typeof v==='string')return v.trim()!=='';if(Array.isArray(v))return v.length>0;if(typeof v==='object'&&v!==null)return hasContent(v);return!!v;});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function formatDate(s){if(!s)return'—';try{return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});}catch{return s;}}

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('loginPage').classList.contains('active'))handleLogin();});
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>कर्मरेखा — Karmarekha by Raj</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-void:#010409;--bg-deep:#061020;--bg-card:rgba(8,20,42,0.65);--bg-glass:rgba(12,28,55,0.45);--bg-glass-heavy:rgba(8,20,42,0.75);--bg-input:rgba(10,25,50,0.6);--purple-mid:#5b2da8;--purple-light:#7c4dff;--purple-glow:rgba(124,77,255,0.25);--cyan:#4fc3f7;--cyan-deep:#0288d1;--cyan-glow:rgba(79,195,247,0.25);--cyan-glow-strong:rgba(79,195,247,0.45);--gold:#c9a84c;--gold-light:#e8d48b;--gold-muted:#8a7535;--gold-glow:rgba(201,168,76,0.2);--border:rgba(79,195,247,0.08);--border-light:rgba(79,195,247,0.15);--border-purple:rgba(124,77,255,0.15);--border-gold:rgba(201,168,76,0.15);--text-primary:#e0eaf5;--text-secondary:#7a9bb5;--text-muted:#3a5470;--success:#4caf50;--danger:#ef5350;--fire:#ff7043;--water:#42a5f5;--earth:#66bb6a;--air:#ab47bc;--pink:#ec407a;--glass-blur:16px;--glass-border:1px solid rgba(79,195,247,0.1);--nav-height:56px;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg-void);color:var(--text-primary);min-height:100vh;overflow-x:hidden;line-height:1.6;}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;}
::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg-void);}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--purple-mid),var(--cyan-deep));border-radius:10px;}
::selection{background:var(--purple-mid);color:#fff;}

.cosmic-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 15% 20%,rgba(124,77,255,0.07) 0%,transparent 55%),radial-gradient(ellipse at 85% 75%,rgba(79,195,247,0.05) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(10,24,48,0.8) 0%,transparent 70%);}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.1;transform:scale(0.8)}50%{opacity:0.8;transform:scale(1.2)}}
.particles-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.particle{position:absolute;border-radius:50%;opacity:0;animation:particleFloat linear infinite;}
.particle.cyan-p{background:var(--cyan);box-shadow:0 0 6px var(--cyan-glow-strong);}
.particle.purple-p{background:var(--purple-light);box-shadow:0 0 6px var(--purple-glow);}
.particle.gold-p{background:var(--gold);box-shadow:0 0 6px var(--gold-glow);}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh) scale(0)}5%{opacity:0.8}50%{opacity:0.3;transform:translateY(50vh) translateX(30px) scale(1)}100%{opacity:0;transform:translateY(-5vh) scale(0.5)}}

.cosmic-seal{position:relative;width:120px;height:120px;margin:0 auto;display:flex;align-items:center;justify-content:center;}
.cosmic-seal.small{width:38px;height:38px;}.cosmic-seal.tiny{width:28px;height:28px;}
.seal-ring-outer{position:absolute;inset:0;border-radius:50%;border:1px solid transparent;border-top-color:var(--cyan);border-right-color:rgba(79,195,247,0.3);animation:sealRotate 12s linear infinite;}
.seal-ring-mid{position:absolute;inset:8px;border-radius:50%;border:1px solid transparent;border-top-color:var(--purple-light);border-bottom-color:rgba(124,77,255,0.4);animation:sealRotateReverse 8s linear infinite;}
.cosmic-seal.small .seal-ring-mid{inset:3px;}.cosmic-seal.tiny .seal-ring-mid{inset:2px;}
.seal-ring-inner{position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(79,195,247,0.15);box-shadow:inset 0 0 20px rgba(124,77,255,0.1);}
.cosmic-seal.small .seal-ring-inner{inset:6px;}.cosmic-seal.tiny .seal-ring-inner{inset:4px;}
.seal-glow{position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(124,77,255,0.15) 0%,rgba(79,195,247,0.08) 40%,transparent 70%);animation:sealPulse 4s ease-in-out infinite;}
.cosmic-seal.small .seal-glow,.cosmic-seal.tiny .seal-glow{inset:-8px;}
.seal-rays{position:absolute;inset:-30px;animation:sealRotate 30s linear infinite;}
.cosmic-seal.small .seal-rays,.cosmic-seal.tiny .seal-rays{display:none;}
.seal-ray{position:absolute;top:50%;left:50%;width:60px;height:1px;transform-origin:0 0;background:linear-gradient(90deg,rgba(79,195,247,0.4),transparent);animation:rayPulse 4s ease-in-out infinite;}
.seal-char{position:relative;z-index:2;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:42px;background:linear-gradient(135deg,var(--cyan),var(--purple-light),var(--cyan));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:sealShimmer 6s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(79,195,247,0.4));}
.cosmic-seal.small .seal-char{font-size:16px;}.cosmic-seal.tiny .seal-char{font-size:12px;}
@keyframes sealRotate{to{transform:rotate(360deg)}}@keyframes sealRotateReverse{to{transform:rotate(-360deg)}}@keyframes sealPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes sealShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes rayPulse{0%,100%{opacity:0.3}50%{opacity:0.7}}

.loading-overlay{position:fixed;inset:0;background:var(--bg-void);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9998;gap:28px;}
.loading-text{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:8px;text-transform:uppercase;color:var(--text-secondary);animation:loadFade 2s ease-in-out infinite;}
@keyframes loadFade{0%,100%{opacity:0.3}50%{opacity:1}}

.page{display:none;position:relative;z-index:2;}.page.active{display:block;animation:pageIn 0.6s ease both;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;top:24px;right:24px;padding:16px 28px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;transform:translateX(calc(100% + 50px));transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);}
.toast.show{transform:translateX(0)}.toast.success{background:rgba(76,175,80,0.9);color:#fff;}.toast.error{background:rgba(239,83,80,0.9);color:#fff;}

.form-group{text-align:left;margin-bottom:22px;}.form-group label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:2px;font-weight:600;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:14px 18px;background:var(--bg-input);backdrop-filter:blur(8px);border:1px solid var(--border-light);border-radius:12px;color:var(--text-primary);font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.3s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-glow);}
.form-group textarea{resize:vertical;min-height:80px;}.form-group select{cursor:pointer;appearance:none;padding-right:40px;}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}

.btn-primary{width:100%;padding:16px 28px;background:linear-gradient(135deg,var(--purple-mid),var(--cyan-deep));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.3s;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:2px;text-transform:uppercase;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,77,255,0.3);}
.btn-secondary{padding:12px 24px;background:transparent;border:1px solid var(--border-light);border-radius:10px;color:var(--text-secondary);cursor:pointer;font-size:13px;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.3s;}
.btn-secondary:hover{border-color:var(--cyan);color:var(--cyan);}
.btn-danger{padding:10px 20px;background:transparent;border:1px solid rgba(239,83,80,0.3);border-radius:10px;color:var(--danger);cursor:pointer;font-size:13px;transition:all 0.3s;}
.error-msg{margin-top:16px;padding:14px 18px;background:rgba(239,83,80,0.1);border:1px solid rgba(239,83,80,0.2);border-radius:12px;color:#ff8a80;font-size:13px;animation:shake 0.5s ease both;}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}

.login-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--bg-glass-heavy);backdrop-filter:blur(var(--glass-blur));border:var(--glass-border);border-radius:24px;padding:56px 48px;width:100%;max-width:440px;text-align:center;position:relative;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.4),0 0 60px rgba(124,77,255,0.06);}
.login-card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple-light),var(--cyan),transparent);opacity:0.6;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;letter-spacing:6px;margin-top:20px;margin-bottom:2px;background:linear-gradient(135deg,var(--cyan),var(--purple-light),var(--gold-light));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:brandShimmer 8s ease-in-out infinite;}
@keyframes brandShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.brand-by{font-size:11px;color:var(--text-muted);letter-spacing:5px;text-transform:uppercase;margin-bottom:8px;}
.brand-tagline{color:var(--text-secondary);font-size:13px;font-style:italic;margin-bottom:36px;font-family:'Cormorant Garamond',serif;}
.admin-link{margin-top:36px;padding-top:24px;border-top:1px solid var(--border);}.admin-link p{font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;}

.top-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(6,16,32,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-height);}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;letter-spacing:3px;background:linear-gradient(135deg,var(--cyan),var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-right{display:flex;align-items:center;gap:10px;}.nav-user{font-size:11px;color:var(--text-secondary);}
.btn-logout{padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;font-size:10px;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.3s;}
.btn-logout:hover{border-color:var(--danger);color:var(--danger);}
.mode-badge{padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:rgba(124,77,255,0.15);color:var(--purple-light);border:1px solid rgba(124,77,255,0.25);}

.tab-bar{position:fixed;bottom:0;left:0;right:0;height:62px;background:rgba(4,8,16,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;padding:0 4px;}
.tab-bar-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;cursor:pointer;transition:all 0.3s;border-radius:10px;min-width:50px;position:relative;}
.tab-bar-item .tab-icon{font-size:18px;transition:transform 0.3s;}.tab-bar-item .tab-label{font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);transition:color 0.3s;}
.tab-bar-item.active .tab-icon{transform:scale(1.2);}.tab-bar-item.active .tab-label{color:var(--cyan);}
.tab-bar-item.active::before{content:'';position:absolute;top:-1px;left:15%;right:15%;height:2px;background:var(--cyan);border-radius:0 0 2px 2px;box-shadow:0 0 8px var(--cyan-glow);}

.greeting-overlay{position:fixed;inset:0;background:var(--bg-void);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;text-align:center;padding:40px;}
.greeting-brand-line{font-size:11px;letter-spacing:6px;text-transform:uppercase;color:var(--text-muted);margin-top:24px;margin-bottom:8px;}
.greeting-divider{width:80px;height:1px;margin:0 auto 36px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple-light),var(--cyan),transparent);opacity:0.6;}
.greeting-text{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--text-secondary);line-height:2.2;max-width:520px;font-style:italic;animation:greetReveal 2s ease both 0.5s;white-space:pre-line;}
@keyframes greetReveal{from{opacity:0;transform:translateY(15px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.greeting-name{color:var(--cyan);font-weight:600;font-style:normal;}
.greeting-enter{margin-top:44px;padding:14px 44px;background:transparent;border:1px solid rgba(79,195,247,0.3);border-radius:30px;color:var(--cyan);cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:4px;text-transform:uppercase;transition:all 0.4s;animation:greetBtn 1s ease both 2s;}
@keyframes greetBtn{from{opacity:0}to{opacity:1}}
.greeting-enter:hover{background:rgba(79,195,247,0.08);border-color:var(--cyan);box-shadow:0 0 30px var(--cyan-glow);}

.dash-body{padding-top:calc(var(--nav-height) + 12px);padding-bottom:78px;max-width:860px;margin:0 auto;padding-left:16px;padding-right:16px;}
.dash-screen{display:none;animation:screenIn 0.5s ease both;}.dash-screen.active{display:block;}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg-glass-heavy);backdrop-filter:blur(var(--glass-blur));border:var(--glass-border);border-radius:16px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden;animation:cardIn 0.6s ease both;transition:border-color 0.4s;}
.card:hover{border-color:rgba(79,195,247,0.15);}
.card::before{content:'';position:absolute;top:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,rgba(79,195,247,0.2),transparent);opacity:0;transition:opacity 0.4s;}
.card:hover::before{opacity:1;}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card h2{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;color:var(--text-primary);margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border);letter-spacing:2px;}
.accent{color:var(--cyan);}

/* FLIP CARDS for Light & Shadow */
.flip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.flip-card{perspective:800px;height:160px;cursor:pointer;}
.flip-card-inner{position:relative;width:100%;height:100%;transition:transform 0.6s cubic-bezier(0.16,1,0.3,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
.flip-front,.flip-back{position:absolute;inset:0;border-radius:14px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;font-size:13px;line-height:1.5;}
.flip-front{background:rgba(79,195,247,0.06);border:1px solid rgba(79,195,247,0.15);color:var(--cyan);}
.flip-front .flip-icon{font-size:24px;margin-bottom:8px;}
.flip-front .flip-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.flip-front .flip-trait{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;}
.flip-back{background:rgba(124,77,255,0.08);border:1px solid rgba(124,77,255,0.2);color:var(--purple-light);transform:rotateY(180deg);}
.flip-back .flip-icon{font-size:24px;margin-bottom:8px;}
.flip-back .flip-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;}
.flip-back .flip-trait{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:600;}
.flip-hint{text-align:center;font-size:10px;color:var(--text-muted);margin-top:12px;letter-spacing:1px;}

/* INTERACTIVE TIMELINE */
.itl-container{position:relative;padding:16px 0;}
.itl-age-marker{text-align:center;margin-bottom:16px;font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--cyan);letter-spacing:2px;}
.itl-age-marker span{background:rgba(79,195,247,0.1);padding:4px 16px;border-radius:20px;border:1px solid rgba(79,195,247,0.2);}
.itl-list{display:flex;flex-direction:column;gap:0;}
.itl-node{display:flex;gap:16px;padding:14px 0;cursor:pointer;transition:all 0.3s;border-radius:12px;position:relative;}
.itl-node:hover{background:rgba(79,195,247,0.03);}
.itl-node.current{background:rgba(79,195,247,0.06);}
.itl-node.past{opacity:0.5;}
.itl-node.past:hover{opacity:0.8;}
.itl-dot-col{display:flex;flex-direction:column;align-items:center;min-width:40px;position:relative;}
.itl-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all 0.3s;position:relative;z-index:2;}
.itl-dot.glow{box-shadow:0 0 12px currentColor,0 0 24px rgba(79,195,247,0.15);}
.itl-line-seg{width:2px;flex:1;min-height:20px;background:linear-gradient(180deg,var(--purple-mid),var(--cyan));opacity:0.3;}
.itl-info{flex:1;padding:2px 0;}
.itl-info-age{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;display:inline;}
.itl-info-cat{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);background:rgba(255,255,255,0.04);padding:2px 8px;border-radius:8px;display:inline-block;margin-left:10px;}
.itl-info-desc{color:var(--text-secondary);font-size:13px;line-height:1.7;margin-top:6px;max-height:0;overflow:hidden;transition:max-height 0.5s ease,opacity 0.3s;opacity:0;}
.itl-node.expanded .itl-info-desc{max-height:200px;opacity:1;}
.itl-info-countdown{font-size:10px;color:var(--gold);margin-top:6px;letter-spacing:1px;max-height:0;overflow:hidden;transition:max-height 0.5s ease;opacity:0;}
.itl-node.expanded .itl-info-countdown{max-height:30px;opacity:1;}
.itl-next-event{text-align:center;padding:16px;background:rgba(201,168,76,0.06);border:1px solid var(--border-gold);border-radius:12px;margin-top:12px;}
.itl-next-event .itl-next-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-muted);margin-bottom:4px;}
.itl-next-event .itl-next-text{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold);}

/* EXPANDABLE SCORE */
.exp-score{margin-bottom:14px;border-radius:14px;overflow:hidden;border:1px solid var(--border);transition:border-color 0.3s;}
.exp-score:hover{border-color:var(--border-light);}
.exp-score-header{display:flex;align-items:center;gap:14px;padding:16px 20px;background:rgba(10,25,50,0.4);cursor:pointer;transition:background 0.3s;}
.exp-score-header:hover{background:rgba(10,25,50,0.6);}
.exp-score-icon{font-size:22px;min-width:32px;text-align:center;}
.exp-score-info{flex:1;}
.exp-score-label{font-size:10px;color:var(--text-secondary);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.exp-score-bar-bg{width:100%;height:5px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;}
.exp-score-bar-fill{height:100%;border-radius:3px;transition:width 2s cubic-bezier(0.16,1,0.3,1);width:0;}
.exp-score-val{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;min-width:44px;text-align:right;}
.exp-score-arrow{font-size:12px;color:var(--text-muted);transition:transform 0.3s;min-width:20px;text-align:center;}
.exp-score.open .exp-score-arrow{transform:rotate(180deg);}
.exp-score-detail{max-height:0;overflow:hidden;transition:max-height 0.5s ease;background:rgba(10,25,50,0.3);}
.exp-score.open .exp-score-detail{max-height:400px;}
.exp-score-detail-inner{padding:16px 20px;}
.exp-factor{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.03);}
.exp-factor:last-child{border-bottom:none;}
.exp-factor .ef-name{color:var(--text-muted);}.exp-factor .ef-val{font-weight:600;}
.ef-pos{color:var(--success);}.ef-neg{color:var(--danger);}

.element-card.water{background:linear-gradient(135deg,rgba(66,165,245,0.08),rgba(5,15,30,0.7),rgba(66,165,245,0.04));border:1px solid rgba(66,165,245,0.15);}
.element-card.earth{background:linear-gradient(135deg,rgba(102,187,106,0.08),rgba(10,20,10,0.7),rgba(102,187,106,0.04));border:1px solid rgba(102,187,106,0.15);}
.element-card.air{background:linear-gradient(135deg,rgba(171,71,188,0.08),rgba(15,5,20,0.7),rgba(171,71,188,0.04));border:1px solid rgba(171,71,188,0.15);}

.element-sub{font-size:10px;color:var(--text-muted);letter-spacing:2px;margin-bottom:18px;text-transform:uppercase;}

.element-card.fire .element-trait{background:rgba(255,112,67,0.12);color:var(--fire);border:1px solid rgba(255,112,67,0.15);}

function hasContent(o){if(!o)return false;return Object.values(o).some(v=>{if(typeof v==='string')return v.trim()!=='';if(Array.isArray(v))return v.length>0;if(typeof v==='object'&&v!==null)return hasContent(v);return!!v;});}
function calcAge(dob){if(!dob)return 0;const b=new Date(dob);const now=new Date();let age=now.getFullYear()-b.getFullYear();if(now.getMonth()<b.getMonth()||(now.getMonth()===b.getMonth()&&now.getDate()<b.getDate()))age--;return age;}

function ef(text,fn,ss,se){return extractField(text,fn,ss,se);}
function extractField(text,fn,ss,se){try{let s=text;if(ss){const i=text.indexOf(`=== ${ss} ===`);if(i!==-1)s=text.substring(i);}if(se){const i=s.indexOf(`=== ${se} ===`);if(i!==-1)s=s.substring(0,i);}const p=new RegExp(`^${fn}:\\s*(.+)$`,'mi');const m=s.match(p);if(m&&m[1]){const v=m[1].trim();if(v.toLowerCase()==='not analyzed yet'||v===''||v==='[')return'';return v;}const mp=new RegExp(`^${fn}:\\s*([\\s\\S]+?)(?=^[A-Z][A-Z\\s]+:|===|$)`,'mi');const mm=s.match(mp);if(mm&&mm[1]){const v=mm[1].trim();if(v.toLowerCase()==='not analyzed yet'||v===''||v==='[')return'';return v;}return'';}catch(e){return'';}}
function extractMarkings(text,ss,se){try{const si=text.indexOf(`=== ${ss} ===`);if(si===-1)return[];const sc=si+ss.length+8;let s=text.substring(sc);const ei=text.indexOf(`=== ${se} ===`);if(ei!==-1)s=text.substring(sc,ei);return s.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('=')&&l.toLowerCase()!=='none'&&!l.startsWith('[')&&l.length>5&&l.includes('-'));}catch(e){return[];}}
function extractTimeline(text){try{const si=text.indexOf('=== TIMELINE EVENTS ===');if(si===-1)return[];const ei=text.indexOf('=== PERSONAL NOTES ===');const sec=ei!==-1?text.substring(si,ei):text.substring(si);const events=[];sec.split('\n').map(l=>l.trim()).filter(l=>l.startsWith('AGE')).forEach(line=>{const parts=line.split('|').map(p=>p.trim());if(parts.length>=3){const am=parts[0].match(/AGE\s+(\d+)/i);if(am){const age=parseInt(am[1]);if(age>=15&&age<=50)events.push({age,category:parts[1].toLowerCase().trim(),description:parts[2].trim(),source:'imported'});}}});return events.sort((a,b)=>a.age-b.age);}catch(e){return[];}}

  const love={base:45,factors:[]};

  if(l.heart?.quality?.includes('Clear')){love.base+=12;love.factors.push({n:'Heart Line Clear',v:'+12',c:'ef-pos'});}
  if(l.heart?.length?.includes('Long')){love.base+=8;love.factors.push({n:'Heart Line Long',v:'+8',c:'ef-pos'});}
  if(l.marriage?.count&&parseInt(l.marriage.count)>=1){love.base+=8;love.factors.push({n:'Marriage Line',v:'+8',c:'ef-pos'});}
  if(m.moon?.development?.includes('Well')){love.base+=4;love.factors.push({n:'Moon Mount',v:'+4',c:'ef-pos'});}

  const spiritual={base:45,factors:[]};
  if(m.moon?.development?.includes('Well')){spiritual.base+=14;spiritual.factors.push({n:'Moon Mount',v:'+14',c:'ef-pos'});}
  if(m.saturn?.development?.includes('Well')){spiritual.base+=10;spiritual.factors.push({n:'Saturn Mount',v:'+10',c:'ef-pos'});}

  const financial={base:45,factors:[]};
  if(m.mercury_mount?.development?.includes('Well')){financial.base+=14;financial.factors.push({n:'Mercury Mount',v:'+14',c:'ef-pos'});}
  if(m.jupiter?.development?.includes('Well')){financial.base+=8;financial.factors.push({n:'Jupiter Mount',v:'+8',c:'ef-pos'});}
  if(l.fate?.quality?.includes('Clear')){financial.base+=10;financial.factors.push({n:'Fate Line Clear',v:'+10',c:'ef-pos'});}
  if(l.sun?.quality?.includes('Clear')){financial.base+=8;financial.factors.push({n:'Sun Line Clear',v:'+8',c:'ef-pos'});}

  const health={base:45,factors:[]};
  if(l.life?.quality?.includes('Clear')){health.base+=14;health.factors.push({n:'Life Line Clear',v:'+14',c:'ef-pos'});}
  if(l.life?.depth?.includes('Deep')){health.base+=10;health.factors.push({n:'Life Line Deep',v:'+10',c:'ef-pos'});}
  if(l.life?.length?.includes('Long')){health.base+=8;health.factors.push({n:'Life Line Long',v:'+8',c:'ef-pos'});}
  if(m.venus?.development?.includes('Well')){health.base+=7;health.factors.push({n:'Venus Mount',v:'+7',c:'ef-pos'});}
  if(l.life?.quality?.includes('Chain')){health.base-=8;health.factors.push({n:'Life Line Chained',v:'-8',c:'ef-neg'});}

  const cp=v=>Math.min(Math.max(Math.round(v),25),97);
  return{career:{score:cp(career.base),factors:career.factors},love:{score:cp(love.base),factors:love.factors},spiritual:{score:cp(spiritual.base),factors:spiritual.factors},financial:{score:cp(financial.base),factors:financial.factors},health:{score:cp(health.base),factors:health.factors}};
}

function generateAnswer(q,user){const ql=q.toLowerCase();const r=user.recommendations||{};const scores=calcScoresDetailed(user);const name=user.name.split(' ')[0];const age=calcAge(user.dob);const tl=user.timelineEvents||[];let cat='general';if(ql.match(/career|job|work|placement|business|profession|company|intern|study|mba|education/))cat='career';else if(ql.match(/love|relationship|marriage|partner|girlfriend|boyfriend|dating|propose|breakup|crush/))cat='love';else if(ql.match(/money|salary|rich|wealth|invest|financial|earning|income/))cat='money';else if(ql.match(/health|illness|body|fitness|disease|stress|anxiety/))cat='health';else if(ql.match(/spiritual|meditation|karma|purpose|soul/))cat='spiritual';else if(ql.match(/future|next year|when|age|timing|predict|will i/))cat='future';

// INTERACTIVE TIMELINE BUILDER
function buildTimeline(events,currentAge,filterCat){
  const filtered=filterCat?events.filter(e=>e.category===filterCat):events;
  if(!filtered.length)return'<div class="no-data">No events yet.</div>';
  const catColors={career:'var(--cyan)',love:'var(--pink)',health:'var(--earth)',spiritual:'var(--air)',travel:'var(--gold)',life:'var(--text-secondary)'};
  const catIcons={career:'⚡',love:'💗',health:'🌿',spiritual:'🧘',travel:'✈️',life:'◉'};
  const nextEvent=filtered.find(e=>e.age>currentAge);
  let h=`<div class="itl-age-marker"><span>You are Age ${currentAge}</span></div>`;
  h+=`<div class="itl-container"><div class="itl-list">`;
  filtered.forEach((ev,i)=>{
    const col=catColors[ev.category]||catColors.life;
    const ico=catIcons[ev.category]||'◉';
    const isPast=ev.age<currentAge;const isCurrent=ev.age===currentAge;const isNext=nextEvent&&ev.age===nextEvent.age;
    const cls=isPast?'past':isCurrent?'current':'';
    const diff=ev.age-currentAge;const countdown=diff>0?`${diff} year${diff>1?'s':''} from now`:diff===0?'This is your current age':`${Math.abs(diff)} year${Math.abs(diff)>1?'s':''} ago`;
    h+=`<div class="itl-node ${cls}" onclick="this.classList.toggle('expanded')" style="animation-delay:${i*0.06}s">
      <div class="itl-dot-col">${i<filtered.length-1?'<div class="itl-line-seg"></div>':''}<div class="itl-dot ${isNext?'glow':''}" style="border:2px solid ${col};color:${col};background:var(--bg-void);${isNext?'box-shadow:0 0 12px '+col+'40':''}">${ico}</div>${i<filtered.length-1?'<div class="itl-line-seg"></div>':''}</div>
      <div class="itl-info"><span class="itl-info-age" style="color:${col}">Age ${ev.age}</span><span class="itl-info-cat">${ev.category}</span><div class="itl-info-desc">${ev.description}</div><div class="itl-info-countdown" style="color:${isPast?'var(--text-muted)':'var(--gold)'}">${countdown}</div></div>
    </div>`;
  });
  h+=`</div></div>`;
  if(nextEvent){h+=`<div class="itl-next-event"><div class="itl-next-label">Next Event</div><div class="itl-next-text">Age ${nextEvent.age} — ${nextEvent.description} (${nextEvent.age-currentAge} yr${nextEvent.age-currentAge>1?'s':''})</div></div>`;}
  return h;}

// CAREER
function renderCareer(user){const scores=calcScoresDetailed(user);const r=user.recommendations||{};const age=calcAge(user.dob);const tl=user.timelineEvents||[];let h='';
  h+=`<div class="hero-score career"><div class="hero-score-value">${scores.career.score}%</div><div class="hero-score-label">Career Force</div></div>`;
  if(r.career)h+=`<div class="card"><h2><span class="accent">💼</span> Career Guidance</h2><div class="detail-card career-border"><p>${r.career}</p></div></div>`;
  h+=`<div class="card"><h2><span class="accent">⚡</span> Career Timeline</h2>${buildTimeline(tl,age,'career')}</div>`;
  if(r.strengths)h+=`<div class="card"><h2><span class="accent">💪</span> Strengths</h2><div class="detail-card"><p>${r.strengths}</p></div></div>`;
  if(r.warnings)h+=`<div class="card"><h2><span class="accent">⚠️</span> Cautions</h2><div class="detail-card warning"><p>${r.warnings}</p></div></div>`;
  document.getElementById('screenCareer').innerHTML=h;}

// LOVE
function renderLove(user){const scores=calcScoresDetailed(user);const r=user.recommendations||{};const age=calcAge(user.dob);const tl=user.timelineEvents||[];let h='';
  h+=`<div class="hero-score love"><div class="hero-score-value">${scores.love.score}%</div><div class="hero-score-label">Love Energy</div></div>`;
  if(r.relationships)h+=`<div class="card"><h2><span class="accent">💕</span> Love & Relationships</h2><div class="detail-card love-border"><p>${r.relationships}</p></div></div>`;
  h+=`<div class="card"><h2><span class="accent">💗</span> Love Timeline</h2>${buildTimeline(tl,age,'love')}</div>`;

  document.getElementById('screenLove').innerHTML=h;}

// MONEY
function renderMoney(user){const scores=calcScoresDetailed(user);const r=user.recommendations||{};let h='';
  h+=`<div class="hero-score money"><div class="hero-score-value">${scores.financial.score}%</div><div class="hero-score-label">Financial Flow</div></div>`;
  if(r.financialTendency)h+=`<div class="card"><h2><span class="accent">💰</span> Financial Path</h2><div class="detail-card gold-border"><p>${r.financialTendency}</p></div></div>`;
  if(r.health)h+=`<div class="card"><h2><span class="accent">🌿</span> Health & Stability</h2><div class="detail-card"><h3>Vitality: ${scores.health.score}%</h3><p>${r.health}</p></div></div>`;
  if(r.warnings)h+=`<div class="card"><h2><span class="accent">⚠️</span> Cautions</h2><div class="detail-card warning"><p>${r.warnings}</p></div></div>`;
  document.getElementById('screenMoney').innerHTML=h;}

// FUTURE
function renderFuture(user){const tl=user.timelineEvents||[];const r=user.recommendations||{};const sp=getSpotlights(user.specialMarkings);const ms=calcMounts(user.mounts);const age=calcAge(user.dob);let h='';
  h+=`<div class="card"><h2><span class="accent">◈</span> Complete Timeline</h2>${buildTimeline(tl,age,null)}</div>`;
  if(sp.length>0){h+=`<div class="card"><h2><span class="accent">✨</span> Rare Markings</h2>`;sp.forEach(s=>{h+=`<div class="marking-spotlight"><div style="font-size:32px;margin-bottom:8px">${s.icon}</div><div style="font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:4px">${s.label}</div><div style="font-size:9px;color:var(--gold-muted);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase">${s.rarity}</div><div style="font-size:13px;color:var(--text-secondary);font-style:italic;line-height:1.7">${s.desc}</div></div>`;});h+=`</div>`;}
  if(ms.length>0){h+=`<div class="card"><h2><span class="accent">◈</span> Mount Energies</h2>`;ms.forEach(m=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:8px 0"><span style="font-size:12px;color:var(--text-secondary);min-width:80px">${m.icon} ${m.label}</span><div style="flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden"><div class="exp-score-bar-fill" data-target="${m.score}" style="height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple-mid),var(--cyan));width:0"></div></div><span style="font-size:10px;color:var(--text-muted);min-width:40px;text-align:right">${m.dev}</span></div>`;});h+=`</div>`;}
  if(r.spiritual)h+=`<div class="card"><h2><span class="accent">🧘</span> Spiritual</h2><div class="detail-card"><p>${r.spiritual}</p></div></div>`;
  if(user.personalNotes)h+=`<div class="card"><h2><span class="accent">📝</span> Notes from Raj</h2><div style="color:var(--text-secondary);font-size:14px;line-height:2;white-space:pre-wrap">${user.personalNotes}</div></div>`;
  h+=`<div class="raw-toggle" onclick="toggleRawData()">📋 View Palm Analysis</div><div class="raw-data-container" id="rawDataContainer">${renderRaw(user)}</div>`;
  document.getElementById('screenFuture').innerHTML=h;}
window.toggleRawData=function(){document.getElementById('rawDataContainer').classList.toggle('visible');};

function renderRaw(user){let h='';const l=user.lines;const m=user.mounts;const f=user.fingers;const mk=user.specialMarkings;
  if(l&&hasContent(l)){h+=`<div class="card"><h2>Lines</h2>`;[{k:'heart',l:'❤️ Heart'},{k:'head',l:'🧠 Head'},{k:'life',l:'🌿 Life'},{k:'fate',l:'🎯 Fate'},{k:'sun',l:'☀️ Sun'},{k:'mercury',l:'☿ Mercury'},{k:'marriage',l:'💍 Marriage'},{k:'girdle_of_venus',l:'🌙 Girdle'},{k:'rascettes',l:'⌚ Rascettes'}].forEach(x=>{const ln=l[x.k];if(!ln||!hasContent(ln))return;h+=`<div class="detail-card"><h3>${x.l}</h3>`;['quality','length','depth','branches','count','present'].forEach(f=>{if(ln[f])h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span style="color:var(--text-muted)">${cap(f)}</span><span>${ln[f]}</span></div>`;});if(ln.description)h+=`<p style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:12px">${ln.description}</p>`;h+=`</div>`;});h+=`</div>`;}
  if(m&&hasContent(m)){h+=`<div class="card"><h2>Mounts</h2>`;[{k:'jupiter',l:'♃ Jupiter'},{k:'saturn',l:'♄ Saturn'},{k:'apollo',l:'☉ Apollo'},{k:'mercury_mount',l:'☿ Mercury'},{k:'venus',l:'♀ Venus'},{k:'moon',l:'☽ Moon'},{k:'mars_positive',l:'♂ Mars+'},{k:'mars_negative',l:'♂ Mars−'},{k:'plain_of_mars',l:'⬜ Plain'}].forEach(x=>{const mt=m[x.k];if(!mt||!hasContent(mt))return;h+=`<div class="detail-card"><h3>${x.l}</h3>`;if(mt.development)h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span style="color:var(--text-muted)">Dev</span><span>${mt.development}</span></div>`;if(mt.description)h+=`<p style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:12px">${mt.description}</p>`;h+=`</div>`;});h+=`</div>`;}
  if(f&&hasContent(f)){h+=`<div class="card"><h2>Fingers</h2>`;[{k:'thumb',l:'👍 Thumb'},{k:'index',l:'☝️ Index'},{k:'middle',l:'🖐️ Middle'},{k:'ring',l:'💍 Ring'},{k:'little',l:'🤙 Little'}].forEach(x=>{const fg=f[x.k];if(!fg||!hasContent(fg))return;h+=`<div class="detail-card"><h3>${x.l}</h3>`;['length','tip_shape','flexibility','leaning','phalanges'].forEach(fd=>{if(fg[fd])h+=`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12px"><span style="color:var(--text-muted)">${cap(fd.replace(/_/g,' '))}</span><span>${fg[fd]}</span></div>`;});if(fg.description)h+=`<p style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:12px">${fg.description}</p>`;h+=`</div>`;});h+=`</div>`;}
  if(mk){let mb='';[{k:'crosses',l:'✝️ Crosses'},{k:'stars',l:'⭐ Stars'},{k:'islands',l:'🏝️ Islands'},{k:'squares',l:'🛡️ Squares'},{k:'triangles',l:'△ Triangles'},{k:'grilles',l:'▦ Grilles'},{k:'dots',l:'⚫ Dots'},{k:'tridents',l:'🔱 Tridents'}].forEach(x=>{const items=mk[x.k];if(!items?.length)return;mb+=`<div class="detail-card"><h3>${x.l}</h3>`;items.forEach(i=>{mb+=`<p style="margin:3px 0;font-size:12px">✦ ${i}</p>`;});mb+=`</div>`;});if(mb)h+=`<div class="card"><h2>Markings</h2>${mb}</div>`;}
  return h;}

// ASK
function renderAsk(user){const name=user.name.split(' ')[0];let h='';
  h+=`<div class="card"><h2><span class="accent">❓</span> Ask Your Palm</h2><p style="color:var(--text-secondary);font-size:13px;margin-bottom:18px;line-height:1.7">Ask anything. Get sharp, age-specific answers from your palm data.</p><div class="ask-input-area"><input type="text" class="ask-input" id="askInput" placeholder="What would you like to know, ${name}?" onkeydown="if(event.key==='Enter')submitQuestion()"><button class="ask-submit" onclick="submitQuestion()">✦</button></div><div class="suggested-q"><div class="suggested-q-btn" onclick="askSuggested('When will my career peak?')">💼 Career peak?</div><div class="suggested-q-btn" onclick="askSuggested('What kind of partner suits me?')">💕 Partner type?</div><div class="suggested-q-btn" onclick="askSuggested('When should I get married?')">💍 Marriage?</div><div class="suggested-q-btn" onclick="askSuggested('Will I be rich?')">💰 Wealth?</div><div class="suggested-q-btn" onclick="askSuggested('What should I avoid?')">⚠️ Avoid?</div><div class="suggested-q-btn" onclick="askSuggested('Business or job?')">🏢 Biz/Job?</div><div class="suggested-q-btn" onclick="askSuggested('What happens next?')">🔮 Future?</div><div class="suggested-q-btn" onclick="askSuggested('Will my relationship last?')">💗 Love future?</div></div></div><div id="askAnswersContainer">`;
  askHistory.forEach(qa=>{h+=`<div class="answer-card"><div class="q-text">Q: ${qa.q}</div><div class="a-text">${qa.a}</div><div class="a-source">✦ Karmarekha by Raj</div></div>`;});
  h+=`</div>`;document.getElementById('screenAsk').innerHTML=h;}
window.submitQuestion=function(){const input=document.getElementById('askInput');const q=input.value.trim();if(!q||!currentUser)return;const a=generateAnswer(q,currentUser);askHistory.unshift({q,a});input.value='';const c=document.getElementById('askAnswersContainer');const card=document.createElement('div');card.className='answer-card';card.innerHTML=`<div class="q-text">Q: ${q}</div><div class="a-text">${a}</div><div class="a-source">✦ Karmarekha by Raj</div>`;c.insertBefore(card,c.firstChild);};
window.askSuggested=function(q){document.getElementById('askInput').value=q;submitQuestion();};
</script>
